const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d');
function render(){if(!bg.complete)return;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,2400,630);ctx.drawImage(bg,0,0,2400,630);ctx.setTransform(2,0,0,2,0,0);
const val=id=>$(id).value.trim();let y=94;ctx.fillStyle='#f7f6f2';ctx.textBaseline='alphabetic';
if($('showName').checked&&val('name')){ctx.font='30px Arial';ctx.fillText(val('name'),75,y,580);y+=30;ctx.font='italic 19px Georgia';ctx.fillText(val('role'),75,y,580);y+=22;}
else{ctx.font='31px Arial';ctx.fillText(val('role'),75,y+12,580);y+=42;}
ctx.fillStyle='#a94a2c';ctx.fillRect(75,y,52,2);y+=24;ctx.fillStyle='#f7f6f2';ctx.font='16px Arial';
for(const id of ['phone','site','instagram','email']){const t=val(id);if(t){ctx.fillText(t,75,y,565);y+=25;}}
}
bg.onload=render;document.querySelectorAll('input').forEach(el=>el.addEventListener('input',render));
$('download').onclick=()=>{$('canvas').toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NR_assinatura_2400x630.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png')};
$('copy').onclick=async()=>{try{const blob=await new Promise(resolve=>$('canvas').toBlob(resolve,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);$('status').textContent='Imagem copiada. Cole na assinatura do Outlook.'}catch(e){$('status').textContent='Cópia bloqueada pelo navegador. Use o botão Baixar PNG.'}};
